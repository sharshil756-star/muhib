<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="qGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090A10" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cyanLattice" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="qBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="800" height="600" fill="#0A0C14"/>
  <rect width="800" height="600" fill="url(#qGlow)"/>

  <!-- Technical Background Grid -->
  <g stroke="#1F2937" stroke-width="1" opacity="0.35">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
  </g>

  <!-- Quantum Cryostat Structure & Golden Coils -->
  <rect x="340" y="40" width="120" height="110" rx="6" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <line x1="400" y1="0" x2="400" y2="40" stroke="#94A3B8" stroke-width="4"/>
  <path d="M 320 150 L 480 150 L 450 240 L 350 240 Z" fill="#0F172A" stroke="url(#goldBeam)" stroke-width="2"/>
  
  <!-- Chandelier Coils & Copper Waveguides -->
  <g stroke="url(#goldBeam)" stroke-width="2" fill="none">
    <path d="M 360 240 C 340 300, 310 330, 270 380"/>
    <path d="M 380 240 C 370 310, 360 340, 340 380"/>
    <path d="M 420 240 C 430 310, 440 340, 460 380"/>
    <path d="M 440 240 C 460 300, 490 330, 530 380"/>
  </g>

  <!-- Quantum Qubit Core & Superconducting Chip -->
  <rect x="330" y="380" width="140" height="140" rx="12" fill="#030712" stroke="#38BDF8" stroke-width="2" filter="url(#qBloom)"/>
  <rect x="350" y="400" width="100" height="100" rx="8" fill="#111827" stroke="url(#goldBeam)" stroke-width="1.5"/>
  
  <!-- Qubit Spin Vectors and Molecular Lattice -->
  <circle cx="400" cy="450" r="30" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="400" cy="450" r="10" fill="#F59E0B" filter="url(#qBloom)"/>
  
  <!-- Interconnected Molecular Synthesizer Nodes -->
  <g stroke="url(#cyanLattice)" stroke-width="1.5">
    <!-- Left Molecule Node -->
    <line x1="330" y1="450" x2="200" y2="430"/>
    <circle cx="200" cy="430" r="18" fill="#0E7490" stroke="#38BDF8" stroke-width="2"/>
    <text x="200" y="434" font-family="monospace" font-size="10" fill="#E0F2FE" text-anchor="middle">Nb₃Sn</text>

    <!-- Top Left Node -->
    <line x1="350" y1="400" x2="240" y2="300"/>
    <circle cx="240" cy="300" r="14" fill="#6D28D9" stroke="#C084FC" stroke-width="2"/>

    <!-- Right Molecule Node -->
    <line x1="470" y1="450" x2="600" y2="430"/>
    <circle cx="600" cy="430" r="18" fill="#047857" stroke="#34D399" stroke-width="2"/>
    <text x="600" y="434" font-family="monospace" font-size="10" fill="#ECFDF5" text-anchor="middle">YBaCuO</text>

    <!-- Top Right Node -->
    <line x1="450" y1="400" x2="560" y2="300"/>
    <circle cx="560" cy="300" r="14" fill="#B45309" stroke="#FBBF24" stroke-width="2"/>
  </g>

  <!-- Interference Waveforms -->
  <path d="M 80 540 Q 200 500, 320 540 T 560 540 T 720 540" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <path d="M 80 555 Q 200 575, 320 555 T 560 555 T 720 555" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>

  <!-- Technical Overlay Typography -->
  <text x="50" y="70" font-family="monospace" font-size="12" fill="#38BDF8" letter-spacing="2">SIMULATION // 1,000,000 QUBIT CRYOGENIC CHAMBER</text>
  <text x="50" y="90" font-family="monospace" font-size="10" fill="#94A3B8">TARGET: ROOM-TEMPERATURE SUPERCONDUCTOR LATTICE</text>
  <text x="750" y="560" font-family="monospace" font-size="11" fill="#A855F7" text-anchor="end">COHERENCE: 99.982% · T₂ = 4.2ms</text>
</svg>
