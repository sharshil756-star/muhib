<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="qAtmosphere" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#312E81" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#1E1B4B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#060814" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldChandelier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="crystalLattice" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="qBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Quantum Cryo Canvas -->
  <rect width="1200" height="900" fill="#060814"/>
  <rect width="1200" height="900" fill="url(#qAtmosphere)"/>

  <!-- Cryostat Chamber Vacuum Grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.45">
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="720" x2="1200" y2="720"/>
    <line x1="240" y1="0" x2="240" y2="900"/>
    <line x1="480" y1="0" x2="480" y2="900"/>
    <line x1="720" y1="0" x2="720" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/>
  </g>

  <!-- Cryogenic Dilution Refrigerator Stage (Golden Chandelier - Left Half) -->
  <g transform="translate(380, 80)">
    <!-- Flange 1 (Top 4K Plate) -->
    <rect x="-140" y="40" width="280" height="24" rx="4" fill="#334155" stroke="url(#goldChandelier)" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="40" stroke="#94A3B8" stroke-width="6"/>

    <!-- Support Struts & Coaxial Golden Cable Bundles -->
    <g stroke="url(#goldChandelier)" stroke-width="3" fill="none">
      <path d="M -100 64 C -90 120, -70 140, -60 180"/>
      <path d="M -60 64 C -50 120, -30 140, -20 180"/>
      <path d="M 60 64 C 50 120, 30 140, 20 180"/>
      <path d="M 100 64 C 90 120, 70 140, 60 180"/>
    </g>

    <!-- Flange 2 (100mK Still Plate) -->
    <rect x="-110" y="180" width="220" height="20" rx="4" fill="#1E293B" stroke="url(#goldChandelier)" stroke-width="2"/>

    <!-- Helical Microwave Resonators -->
    <g stroke="url(#goldChandelier)" stroke-width="2.5" fill="none">
      <path d="M -80 200 C -70 260, -50 280, -40 320"/>
      <path d="M 80 200 C 70 260, 50 280, 40 320"/>
      <path d="M -20 200 L -10 320"/>
      <path d="M 20 200 L 10 320"/>
    </g>

    <!-- Flange 3 (10mK Mixing Chamber Plate) -->
    <rect x="-80" y="320" width="160" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>

    <!-- Superconducting Quantum Processing Core -->
    <rect x="-50" y="338" width="100" height="100" rx="10" fill="#020617" stroke="#38BDF8" stroke-width="2" filter="url(#qBloom)"/>
    <circle cx="0" cy="388" r="22" fill="#0B132B" stroke="#FDE047" stroke-width="2"/>
    <circle cx="0" cy="388" r="8" fill="#FFFFFF" filter="url(#qBloom)"/>
  </g>

  <!-- Molecular Crystal Lattice Simulation of Solid-State Electrolyte (Right Half) -->
  <g transform="translate(820, 420)">
    <!-- Crystalline Hexagonal Unit Cell Grid -->
    <g stroke="url(#crystalLattice)" stroke-width="2" fill="none">
      <!-- Front Face -->
      <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60"/>
      <!-- Inner Octahedral Coordination Interconnects -->
      <line x1="0" y1="-120" x2="0" y2="120"/>
      <line x1="-104" y1="-60" x2="104" y2="60"/>
      <line x1="-104" y1="60" x2="104" y2="-60"/>
    </g>

    <!-- Cation & Anion Atomic Lattice Spheres -->
    <!-- Lithium / Lanthanum Cations (Luminescent Amber) -->
    <g filter="url(#qBloom)">
      <circle cx="0" cy="-120" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="104" cy="-60" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="104" cy="60" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="0" cy="120" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="-104" cy="60" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="-104" cy="-60" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>

    <!-- Superconducting Quantum Electron Pairs (Center Singularity) -->
    <circle cx="0" cy="0" r="20" fill="#0284C7" stroke="#38BDF8" stroke-width="2" filter="url(#qBloom)"/>
    <circle cx="0" cy="0" r="8" fill="#F8FAFC"/>
    
    <!-- Wave-Function Probability Clouds -->
    <ellipse cx="0" cy="0" rx="160" ry="70" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  </g>

  <!-- Hamiltonian Energy Telemetry HUD -->
  <g transform="translate(800, 140)">
    <rect width="320" height="150" rx="6" fill="#0B1120" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="16" y="24" fill="#38BDF8" font-family="monospace" font-size="10" letter-spacing="1">QUANTUM-AI HAMILTONIAN SCREEN</text>
    <text x="16" y="52" fill="#FDE047" font-family="monospace" font-size="13" font-weight="bold">IONIC CONDUCTIVITY: 14.8 mS/cm</text>
    <text x="16" y="76" fill="#94A3B8" font-family="monospace" font-size="9">CANDIDATE COMPOUND: Li7La3Zr2O12 (LLZO)</text>
    <text x="16" y="98" fill="#34D399" font-family="monospace" font-size="9">VQE CONVERGENCE: &lt; 10^-6 HARTREE</text>
    <text x="16" y="122" fill="#F59E0B" font-family="monospace" font-size="9">SYNTHESIS SUCCESS PROBABILITY: 96.2%</text>
  </g>

  <!-- Frame & Metadata -->
  <text x="60" y="80" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="2">MONOGRAPH 05 · FUTURE OF AI IN QUANTUM MATERIAL DISCOVERY</text>
  <text x="60" y="105" fill="#38BDF8" font-family="monospace" font-size="10">FIG. 05 — TOPOLOGICAL LATTICE AND 10mK CRYOSTAT MOLECULAR SIMULATION</text>
  <rect x="20" y="20" width="1160" height="860" fill="none" stroke="#1E293B" stroke-width="1"/>
</svg>
