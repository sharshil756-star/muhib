<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="medAtmosphere" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#0F172A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="proteinCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dnaLadder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="medBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Clinical Obsidian Canvas -->
  <rect width="1200" height="900" fill="#070A12"/>
  <rect width="1200" height="900" fill="url(#medAtmosphere)"/>

  <!-- Clinical Laboratory Grid & Laser Guides -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.6">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="1120" y1="0" x2="1120" y2="900"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="760" x2="1200" y2="760"/>
  </g>

  <!-- Holographic Scanner Pedestal Rings (Base of Diagnostics) -->
  <g transform="translate(600, 720)">
    <ellipse cx="0" cy="0" rx="360" ry="70" fill="none" stroke="#1E293B" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="280" ry="54" fill="none" stroke="#0284C7" stroke-width="2" stroke-dasharray="10 8" opacity="0.75"/>
    <ellipse cx="0" cy="0" rx="190" ry="36" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="2.5" filter="url(#medBloom)"/>
    <ellipse cx="0" cy="0" rx="90" ry="18" fill="#F8FAFC" fill-opacity="0.8" filter="url(#medBloom)"/>
  </g>

  <!-- Vertical Scanning Coaxial Beams -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.4" stroke-dasharray="6 6">
    <line x1="320" y1="120" x2="320" y2="720"/>
    <line x1="880" y1="120" x2="880" y2="720"/>
  </g>
  <line x1="260" y1="420" x2="940" y2="420" stroke="#F59E0B" stroke-width="2" stroke-dasharray="12 6" filter="url(#medBloom)" opacity="0.9"/>

  <!-- Central Holographic Patient Digital Twin (Silhouette with Neural & Microvascular Vectors) -->
  <g transform="translate(600, 240)">
    <!-- Cranial Neural Net Core -->
    <circle cx="0" cy="30" r="42" fill="#0C1527" stroke="#38BDF8" stroke-width="2.5" filter="url(#medBloom)"/>
    <circle cx="0" cy="30" r="22" fill="none" stroke="#F59E0B" stroke-dasharray="4 4" stroke-width="2"/>
    <circle cx="0" cy="30" r="6" fill="#FFFFFF"/>

    <!-- Spinal & Organ Vascular Axis -->
    <line x1="0" y1="72" x2="0" y2="340" stroke="#F8FAFC" stroke-width="3" filter="url(#medBloom)"/>
    
    <!-- Thoracic / Cardiac Organoid Mesh -->
    <ellipse cx="0" cy="150" rx="90" ry="50" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
    <circle cx="15" cy="140" r="14" fill="#EF4444" fill-opacity="0.7" stroke="#F87171" stroke-width="2" filter="url(#medBloom)"/>
    
    <!-- Abdominal Metabolic Grid -->
    <ellipse cx="0" cy="240" rx="75" ry="42" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
    
    <!-- Limb Vectors -->
    <path d="M -80 120 L -160 220 L -210 330" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
    <path d="M 80 120 L 160 220 L 210 330" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
    <path d="M -45 320 L -70 430 L -90 480" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
    <path d="M 45 320 L 70 430 L 90 480" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Left Scientific Panel: Multi-Omic DNA & Methylation Sequencer -->
  <g transform="translate(110, 200)">
    <rect width="260" height="380" rx="8" fill="#0A101D" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.5"/>
    <rect width="260" height="32" rx="8" fill="#0F172A"/>
    <text x="18" y="21" fill="#38BDF8" font-family="monospace" font-size="11" letter-spacing="1">DNA METHYLATION ARRAY</text>
    
    <!-- Double-Helix Schematic -->
    <g transform="translate(130, 60)" stroke="url(#dnaLadder)" stroke-width="2.5" fill="none">
      <path d="M -40 0 Q 0 40, 40 80 T -40 160 T 40 240"/>
      <path d="M 40 0 Q 0 40, -40 80 T 40 160 T -40 240"/>
      <!-- Base Pair Rungs -->
      <line x1="-32" y1="20" x2="32" y2="20" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="-15" y1="50" x2="15" y2="50" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="-32" y1="100" x2="32" y2="100" stroke="#F59E0B" stroke-width="2"/>
      <line x1="-15" y1="130" x2="15" y2="130" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="-32" y1="180" x2="32" y2="180" stroke="#38BDF8" stroke-width="2"/>
      <line x1="-15" y1="210" x2="15" y2="210" stroke="#94A3B8" stroke-width="1.5"/>
    </g>

    <text x="18" y="330" fill="#94A3B8" font-family="monospace" font-size="10">EPIGENETIC BIOMARKER: ONC-0</text>
    <text x="18" y="350" fill="#10B981" font-family="monospace" font-size="11" font-weight="bold">PREDICTION CONFIDENCE: 98.4%</text>
  </g>

  <!-- Right Scientific Panel: Holographic De Novo Protein Folding -->
  <g transform="translate(830, 200)">
    <rect width="260" height="380" rx="8" fill="#0A101D" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.5"/>
    <rect width="260" height="32" rx="8" fill="#0F172A"/>
    <text x="18" y="21" fill="#F59E0B" font-family="monospace" font-size="11" letter-spacing="1">PROTEIN FOLDING DYNAMICS</text>

    <!-- Complex 3D Ribbon Enzyme Folding -->
    <g transform="translate(130, 150)">
      <circle cx="0" cy="0" r="70" fill="url(#proteinCore)" opacity="0.6"/>
      <!-- Alpha Helices -->
      <path d="M -50 -40 C -20 -70, 30 -60, 50 -30 C 70 0, 50 40, 20 50 C -10 60, -40 30, -50 0 Z" fill="none" stroke="#F59E0B" stroke-width="3" filter="url(#medBloom)"/>
      <path d="M -30 -20 C 0 -40, 40 -30, 45 0 C 50 30, 10 40, -10 30 Z" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
      <!-- Ligand Binding Pockets -->
      <circle cx="20" cy="-35" r="7" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="-35" cy="15" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>

    <text x="18" y="330" fill="#94A3B8" font-family="monospace" font-size="10">TARGET: HLA-A*0201 RECEPTOR</text>
    <text x="18" y="350" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">SYNTHESIS TIME: 72 HOURS</text>
  </g>

  <!-- Editorial Top & Bottom Banner Frame -->
  <text x="60" y="80" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="2">MONOGRAPH 01 · FUTURE OF AI IN HEALTHCARE: CLINICAL DIAGNOSTICS</text>
  <text x="60" y="105" fill="#38BDF8" font-family="monospace" font-size="10">FIG. 01 — MULTI-MODAL LIQUID BIOPSY AND DIGITAL TWIN GENOMIC PIPELINE</text>
  <rect x="20" y="20" width="1160" height="860" fill="none" stroke="#1E293B" stroke-width="1"/>
</svg>
