<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="cityAtmosphere" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#0F172A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="timberTower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <linearGradient id="transitFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="cityBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Urban Canvas -->
  <rect width="1200" height="900" fill="#030712"/>
  <rect width="1200" height="900" fill="url(#cityAtmosphere)"/>

  <!-- Isometric Ground Plane Grid (Digital Twin Mesh) -->
  <g stroke="#1E293B" stroke-width="1.2" opacity="0.6">
    <path d="M 600 340 L 1140 640 L 600 860 L 60 640 Z" fill="#0B132B" opacity="0.45"/>
    <line x1="600" y1="340" x2="600" y2="860"/>
    <line x1="60" y1="640" x2="1140" y2="640"/>
    <!-- Diagonal Iso Lines -->
    <line x1="240" y1="440" x2="780" y2="740"/>
    <line x1="420" y1="540" x2="960" y2="840"/>
    <line x1="960" y1="440" x2="420" y2="740"/>
    <line x1="780" y1="540" x2="240" y2="840"/>
  </g>

  <!-- Futuristic Skyscrapers & Digital Twin Prisms (Isometric City Center) -->
  <!-- Tower 1: Central Master Spire -->
  <g transform="translate(600, 200)">
    <!-- Left Face -->
    <polygon points="0,0 -80,45 -80,380 0,335" fill="#0A2238" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Right Face -->
    <polygon points="0,0 80,45 80,380 0,335" fill="#061828" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Top Face -->
    <polygon points="0,0 80,45 0,90 -80,45" fill="#38BDF8" opacity="0.8"/>
    <!-- Vertical Forest Terraces & Skygarden Balconies -->
    <g fill="#10B981" opacity="0.85">
      <rect x="-70" y="120" width="14" height="6" rx="2"/>
      <rect x="-70" y="180" width="14" height="6" rx="2"/>
      <rect x="-70" y="240" width="14" height="6" rx="2"/>
      <rect x="56" y="120" width="14" height="6" rx="2"/>
      <rect x="56" y="180" width="14" height="6" rx="2"/>
      <rect x="56" y="240" width="14" height="6" rx="2"/>
    </g>
    <!-- Roof Antenna Communication Spire -->
    <line x1="0" y1="0" x2="0" y2="-90" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="0" cy="-90" r="7" fill="#FDE047" filter="url(#cityBloom)"/>
  </g>

  <!-- Tower 2: West Biophilic High-Rise -->
  <g transform="translate(420, 280)">
    <polygon points="0,0 -60,35 -60,320 0,285" fill="#0A2238" stroke="#38BDF8" stroke-width="1.2"/>
    <polygon points="0,0 60,35 60,320 0,285" fill="#061828" stroke="#38BDF8" stroke-width="1.2"/>
    <polygon points="0,0 60,35 0,70 -60,35" fill="#0284C7" opacity="0.8"/>
  </g>

  <!-- Tower 3: East Technology Hub -->
  <g transform="translate(780, 280)">
    <polygon points="0,0 -60,35 -60,320 0,285" fill="#0A2238" stroke="#38BDF8" stroke-width="1.2"/>
    <polygon points="0,0 60,35 60,320 0,285" fill="#061828" stroke="#38BDF8" stroke-width="1.2"/>
    <polygon points="0,0 60,35 0,70 -60,35" fill="#0284C7" opacity="0.8"/>
  </g>

  <!-- Skybridges Connecting Towers -->
  <g stroke="#38BDF8" stroke-width="3" fill="#0F172A">
    <path d="M 420 400 L 520 360 L 520 375 L 420 415 Z"/>
    <path d="M 680 360 L 780 400 L 780 415 L 680 375 Z"/>
  </g>

  <!-- Autonomous Micro-Transit Pulse Lines (Glowing Amber/Red Transit Tracks) -->
  <g stroke="url(#transitFlow)" stroke-width="3" fill="none" filter="url(#cityBloom)">
    <path d="M 160 580 Q 420 490, 600 580 T 1040 580"/>
    <path d="M 320 700 Q 600 610, 880 700"/>
  </g>
  <!-- Moving Autonomous Shuttles (Data Packets) -->
  <circle cx="480" cy="545" r="6" fill="#FDE047" filter="url(#cityBloom)"/>
  <circle cx="720" cy="570" r="6" fill="#EF4444" filter="url(#cityBloom)"/>
  <circle cx="600" cy="655" r="6" fill="#FDE047" filter="url(#cityBloom)"/>

  <!-- Municipal Digital Twin Telemetry HUD -->
  <g transform="translate(100, 160)">
    <rect width="280" height="150" rx="6" fill="#071324" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="16" y="24" fill="#38BDF8" font-family="monospace" font-size="10" letter-spacing="1">MUNICIPAL DIGITAL TWIN</text>
    <text x="16" y="52" fill="#FDE047" font-family="monospace" font-size="13" font-weight="bold">TRANSIT CONGESTION: 0.0%</text>
    <text x="16" y="76" fill="#94A3B8" font-family="monospace" font-size="9">STORMWATER BUFFER: 91% CAPACITY</text>
    <text x="16" y="98" fill="#10B981" font-family="monospace" font-size="9">DISTRICT THERMAL EFFICIENCY: 98%</text>
    <text x="16" y="122" fill="#38BDF8" font-family="monospace" font-size="9">DYNAMIC EV CHARGING: BALANCED</text>
  </g>

  <!-- Frame & Metadata -->
  <text x="60" y="80" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="2">MONOGRAPH 09 · FUTURE OF AI IN SMART CITIES &amp; DIGITAL TWINS</text>
  <text x="60" y="105" fill="#38BDF8" font-family="monospace" font-size="10">FIG. 09 — MULTI-LAYER MUNICIPAL SIMULATION AND AUTONOMOUS TRANSIT HEADWAYS</text>
  <rect x="20" y="20" width="1160" height="860" fill="none" stroke="#1E293B" stroke-width="1"/>
</svg>
