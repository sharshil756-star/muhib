<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="cityGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="towerGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="transitBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="cityBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="800" height="600" fill="#020617"/>
  <rect width="800" height="600" fill="url(#cityGlow)"/>

  <!-- Isometric Ground Grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.6">
    <path d="M 400 250 L 760 450 L 400 580 L 40 450 Z" fill="#0B132B" opacity="0.4"/>
    <line x1="400" y1="250" x2="400" y2="580"/>
    <line x1="40" y1="450" x2="760" y2="450"/>
    <line x1="160" y1="316" x2="520" y2="516"/>
    <line x1="280" y1="383" x2="640" y2="583"/>
    <line x1="640" y1="316" x2="280" y2="516"/>
    <line x1="520" y1="383" x2="160" y2="583"/>
  </g>

  <!-- Futuristic Skyscrapers & Digital Twin Towers (Isometric Prisms) -->
  <!-- Tower Center-Left (Tallest) -->
  <g transform="translate(320, 100)">
    <!-- Left Face -->
    <polygon points="0,60 -60,95 -60,360 0,325" fill="#0F2537" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Right Face -->
    <polygon points="0,60 60,95 60,360 0,325" fill="#0C1D2C" stroke="#38BDF8" stroke-width="1.2"/>
    <!-- Top Face -->
    <polygon points="0,60 60,95 0,130 -60,95" fill="#38BDF8" opacity="0.8"/>
    <!-- Luminous Windows / Activity Nodes -->
    <g fill="#38BDF8" opacity="0.75" filter="url(#cityBloom)">
      <circle cx="-30" cy="160" r="3"/>
      <circle cx="-15" cy="180" r="3"/>
      <circle cx="-40" cy="220" r="3"/>
      <circle cx="30" cy="160" r="3"/>
      <circle cx="45" cy="210" r="3"/>
      <circle cx="20" cy="260" r="3"/>
    </g>
    <!-- Spire -->
    <line x1="0" y1="60" x2="0" y2="0" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#F43F5E" filter="url(#cityBloom)"/>
  </g>

  <!-- Tower Center-Right -->
  <g transform="translate(480, 150)">
    <polygon points="0,50 -50,80 -50,300 0,270" fill="#091A28" stroke="#0EA5E9" stroke-width="1.2"/>
    <polygon points="0,50 50,80 50,300 0,270" fill="#06121C" stroke="#0EA5E9" stroke-width="1.2"/>
    <polygon points="0,50 50,80 0,110 -50,80" fill="#0EA5E9" opacity="0.7"/>
    <line x1="0" y1="50" x2="0" y2="10" stroke="#0EA5E9" stroke-width="2"/>
    <circle cx="0" cy="10" r="3.5" fill="#F59E0B" filter="url(#cityBloom)"/>
  </g>

  <!-- Tower Left (Medium) -->
  <g transform="translate(180, 220)">
    <polygon points="0,40 -40,65 -40,240 0,215" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <polygon points="0,40 40,65 40,240 0,215" fill="#0B132B" stroke="#0284C7" stroke-width="1"/>
    <polygon points="0,40 40,65 0,90 -40,65" fill="#0284C7" opacity="0.6"/>
  </g>

  <!-- Tower Right (Forefront) -->
  <g transform="translate(620, 240)">
    <polygon points="0,40 -40,65 -40,220 0,195" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <polygon points="0,40 40,65 40,220 0,195" fill="#0B132B" stroke="#0284C7" stroke-width="1"/>
    <polygon points="0,40 40,65 0,90 -40,65" fill="#0284C7" opacity="0.6"/>
  </g>

  <!-- Sky-Bridge Interconnect between Towers -->
  <path d="M 320 230 L 480 250" stroke="#38BDF8" stroke-width="3" opacity="0.9"/>
  <path d="M 320 234 L 480 254" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Autonomous EV & Transit Flow Corridors (Ground Neon Streaks) -->
  <path d="M 120 480 L 400 370 L 680 490" fill="none" stroke="url(#transitBeam)" stroke-width="3" filter="url(#cityBloom)"/>
  <path d="M 220 540 L 400 450 L 580 540" fill="none" stroke="#38BDF8" stroke-width="2.5" filter="url(#cityBloom)"/>

  <!-- Holographic Urban Sensor Callouts -->
  <g stroke="#34D399" stroke-width="1">
    <line x1="480" y1="360" x2="560" y2="330"/>
    <circle cx="560" cy="330" r="3" fill="#34D399"/>
  </g>
  <rect x="560" y="315" width="140" height="36" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="570" y="330" font-family="monospace" font-size="9" fill="#34D399">TRAFFIC GRID: -42% LATENCY</text>
  <text x="570" y="343" font-family="monospace" font-size="9" fill="#A7F3D0">CO₂ SENSOR: NET-ZERO FLOW</text>

  <!-- Technical Headings -->
  <text x="50" y="60" font-family="monospace" font-size="12" fill="#38BDF8" letter-spacing="2">SMART METROPOLIS DIGITAL TWIN // 2035</text>
  <text x="50" y="80" font-family="monospace" font-size="10" fill="#94A3B8">CONTINUOUS VOLUMETRIC LIDAR &amp; REAL-TIME AUTONOMOUS MOBILITY</text>
  <text x="750" y="570" font-family="monospace" font-size="11" fill="#38BDF8" text-anchor="end">CIVIC EFFICIENCY: +88% OPTIMIZATION INDEX</text>
</svg>
