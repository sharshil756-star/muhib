<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="robotAtmosphere" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#1C1917" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="titaniumSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="carbonTexture" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="robotBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Industrial Atelier Canvas -->
  <rect width="1200" height="900" fill="#0C0A09"/>
  <rect width="1200" height="900" fill="url(#robotAtmosphere)"/>

  <!-- Precision Atelier Workbench Grid -->
  <g stroke="#292524" stroke-width="1.2" opacity="0.7">
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="0" y1="740" x2="1200" y2="740"/>
    <line x1="0" y1="850" x2="1200" y2="850"/>
    <!-- Perspective Bench Slits -->
    <line x1="200" y1="640" x2="80" y2="900"/>
    <line x1="450" y1="640" x2="380" y2="900"/>
    <line x1="750" y1="640" x2="720" y2="900"/>
    <line x1="1000" y1="640" x2="1020" y2="900"/>
  </g>

  <!-- Humanoid Cobot Upper Torso & Head (Left/Center) -->
  <g transform="translate(360, 240)">
    <!-- Head Sculpt & Visor -->
    <rect x="-60" y="-120" width="120" height="150" rx="28" fill="#1C1917" stroke="url(#titaniumSheen)" stroke-width="2.5"/>
    <!-- Multi-Spectral Optical Visor -->
    <rect x="-45" y="-75" width="90" height="26" rx="8" fill="#0284C7" stroke="#38BDF8" stroke-width="2" filter="url(#robotBloom)"/>
    <circle cx="-18" cy="-62" r="5" fill="#F8FAFC"/>
    <circle cx="18" cy="-62" r="5" fill="#F8FAFC"/>
    
    <!-- Torso Chassis Frame -->
    <path d="M -90 60 L 90 60 L 70 280 L -70 280 Z" fill="#18181B" stroke="#44403C" stroke-width="2"/>
    <!-- Luminous Kinematic Compute Core -->
    <circle cx="0" cy="140" r="36" fill="#09090B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="0" cy="140" r="20" fill="#EA580C" stroke="#F59E0B" stroke-width="2" filter="url(#robotBloom)"/>

    <!-- High-Torque Cobot Arm Reaching to Center -->
    <g stroke="url(#titaniumSheen)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 80 80 L 210 140 L 320 90 L 410 180"/>
    </g>
    <!-- Joint Servo Rings with Embedded Strain Gauges -->
    <circle cx="80" cy="80" r="18" fill="#EA580C" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="210" cy="140" r="16" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="320" cy="90" r="14" fill="#EA580C" stroke="#FFFFFF" stroke-width="2.5"/>
    
    <!-- Multi-Phalange Dexterous End-Effector Gripper -->
    <g stroke="#38BDF8" stroke-width="4" stroke-linecap="round" fill="#0F172A">
      <path d="M 410 180 L 445 160 L 475 190"/>
      <path d="M 410 180 L 445 200 L 475 200"/>
      <!-- Laser Guide Point -->
      <line x1="475" y1="195" x2="550" y2="280" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 4" filter="url(#robotBloom)"/>
      <circle cx="550" cy="280" r="4" fill="#F87171" filter="url(#robotBloom)"/>
    </g>
  </g>

  <!-- Central Aerospace Component: Carbon-Composite Turbine Blisk -->
  <g transform="translate(680, 520)">
    <ellipse cx="0" cy="0" rx="160" ry="70" fill="url(#carbonTexture)" stroke="#78716C" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="100" ry="44" fill="#0C0A09" stroke="#EA580C" stroke-width="2"/>
    <!-- Precision Machined Stator Blades -->
    <g stroke="#A8A29E" stroke-width="2">
      <line x1="-120" y1="-20" x2="-80" y2="-10"/>
      <line x1="-80" y1="-50" x2="-50" y2="-30"/>
      <line x1="0" y1="-65" x2="0" y2="-40"/>
      <line x1="80" y1="-50" x2="50" y2="-30"/>
      <line x1="120" y1="-20" x2="80" y2="-10"/>
      <line x1="-120" y1="20" x2="-80" y2="10"/>
      <line x1="0" y1="65" x2="0" y2="40"/>
      <line x1="120" y1="20" x2="80" y2="10"/>
    </g>
    <!-- Sub-Millimeter Tolerance Measurement Ring -->
    <ellipse cx="0" cy="0" rx="175" ry="78" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>

  <!-- Master Artisan Human Hands (Right Side Collaboration) -->
  <g transform="translate(860, 480)" fill="#78350F" opacity="0.85">
    <!-- Human Forearm and Hand Guiding Component -->
    <path d="M 120 180 L 40 40 C 25 35, 10 40, -10 50 L -30 65 L 10 90 L 80 200 Z" fill="#292524" stroke="#44403C" stroke-width="2"/>
  </g>

  <!-- Real-Time Haptic Telemetry & Sub-Millimeter HUD -->
  <g transform="translate(830, 160)">
    <rect width="280" height="150" rx="6" fill="#1C1917" fill-opacity="0.85" stroke="#EA580C" stroke-width="1.5"/>
    <text x="16" y="24" fill="#FB923C" font-family="monospace" font-size="10" letter-spacing="1">FORCE-FEEDBACK CALIBRATION</text>
    <text x="16" y="52" fill="#E2E8F0" font-family="monospace" font-size="13" font-weight="bold">CONTACT TORQUE: 0.12 N·m</text>
    <rect x="16" y="66" width="240" height="8" rx="2" fill="#292524"/>
    <rect x="16" y="66" width="210" height="8" rx="2" fill="#10B981"/>
    <text x="16" y="98" fill="#94A3B8" font-family="monospace" font-size="9">SAFETY INVARIANT: COLLISION FREE</text>
    <text x="16" y="122" fill="#38BDF8" font-family="monospace" font-size="9">SUB-MILLIMETER RUNOUT: ± 0.004 mm</text>
  </g>

  <!-- Frame & Metadata -->
  <text x="60" y="80" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="2">MONOGRAPH 03 · FUTURE OF AI IN COLLABORATIVE ROBOTICS</text>
  <text x="60" y="105" fill="#FB923C" font-family="monospace" font-size="10">FIG. 03 — SUB-MILLIMETER TACTILE SENSING AND FORCE-TORQUE ARTISAN ATELIER</text>
  <rect x="20" y="20" width="1160" height="860" fill="none" stroke="#292524" stroke-width="1"/>
</svg>
