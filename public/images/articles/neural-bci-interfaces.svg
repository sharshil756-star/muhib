<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bciAtmosphere" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#1E1035" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#090417" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="synapseGlowFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="bciBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Neuro-Violet Canvas -->
  <rect width="1200" height="900" fill="#090417"/>
  <rect width="1200" height="900" fill="url(#bciAtmosphere)"/>

  <!-- Cranial Silhouette & Cortical Contour (Center Left) -->
  <g transform="translate(520, 460)">
    <!-- Cerebral Outline -->
    <path d="M -160 220 C -200 120, -240 60, -240 -60 C -240 -200, -120 -300, 40 -300 C 180 -300, 280 -180, 280 -40 C 280 80, 200 180, 160 240" 
          fill="none" stroke="#6D28D9" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6"/>

    <!-- High-Density Non-Invasive Neural Mesh Lace (Over Motor & Temporal Cortex) -->
    <g stroke="url(#synapseGlowFlow)" stroke-width="2" fill="none">
      <path d="M -100 -180 Q -20 -240, 80 -200 T 220 -120"/>
      <path d="M -160 -100 Q -60 -160, 60 -110 T 240 -40"/>
      <path d="M -180 -20 Q -80 -80, 40 -20 T 200 60"/>
      <path d="M -140 80 Q -40 20, 80 80 T 160 160"/>
      
      <!-- Interconnecting Axon Dendrite Strands -->
      <path d="M -80 -210 Q -70 -70, -100 80"/>
      <path d="M 0 -230 Q 10 -60, 20 100"/>
      <path d="M 80 -200 Q 110 -40, 90 120"/>
      <path d="M 160 -160 Q 180 -20, 170 140"/>
    </g>

    <!-- Synaptic Electro-Optical Micro-Transducers (Glowing Action Potentials) -->
    <g filter="url(#bciBloom)">
      <circle cx="-20" cy="-180" r="8" fill="#06B6D4"/>
      <circle cx="80" cy="-170" r="9" fill="#A855F7"/>
      <circle cx="-60" cy="-70" r="7" fill="#F43F5E"/>
      <circle cx="40" cy="-80" r="10" fill="#06B6D4"/>
      <circle cx="140" cy="-60" r="8" fill="#A855F7"/>
      <circle cx="-70" cy="40" r="8" fill="#A855F7"/>
      <circle cx="30" cy="30" r="9" fill="#F43F5E"/>
      <circle cx="120" cy="50" r="7" fill="#06B6D4"/>
    </g>

    <!-- Non-Invasive Functional Ultrasound Transducer Headband -->
    <path d="M -220 -130 C -80 -220, 100 -220, 260 -130" fill="none" stroke="#F59E0B" stroke-width="4" filter="url(#bciBloom)"/>
    <circle cx="-220" cy="-130" r="8" fill="#F59E0B"/>
    <circle cx="-80" cy="-190" r="7" fill="#FDE047"/>
    <circle cx="100" cy="-190" r="7" fill="#FDE047"/>
    <circle cx="260" cy="-130" r="8" fill="#F59E0B"/>
  </g>

  <!-- Right Scientific Panel: Real-Time Decoded Phoneme Speech Stream -->
  <g transform="translate(820, 180)">
    <rect width="280" height="380" rx="8" fill="#150B28" fill-opacity="0.9" stroke="#A855F7" stroke-width="1.5"/>
    <text x="16" y="28" fill="#C084FC" font-family="monospace" font-size="10" letter-spacing="1">DECODED SPEECH SYNTHESIS</text>
    
    <!-- Real-time Audio Phoneme Waveform -->
    <g transform="translate(16, 70)" stroke="#38BDF8" stroke-width="2" fill="none" filter="url(#bciBloom)">
      <path d="M 0 30 Q 20 0, 40 30 T 80 30 T 120 5 T 160 55 T 200 30 T 240 30"/>
    </g>

    <!-- Decoded Linguistic Intent Card -->
    <rect x="16" y="140" width="248" height="90" rx="6" fill="#20113B" stroke="#6D28D9"/>
    <text x="26" y="165" fill="#94A3B8" font-family="monospace" font-size="9">SYNTHESIZED INTENT (0.012s LATENCY):</text>
    <text x="26" y="195" fill="#FDE047" font-family="serif" font-size="16" font-style="italic">"Restoring natural conversational flow."</text>
    
    <text x="16" y="270" fill="#94A3B8" font-family="monospace" font-size="9">DECODING SPEED: 115 WORDS/MIN</text>
    <text x="16" y="295" fill="#10B981" font-family="monospace" font-size="9">VOCABULARY SIZE: 125,000 TOKENS</text>
    <text x="16" y="320" fill="#38BDF8" font-family="monospace" font-size="9">MOTOR REHABILITATION: ACTIVE</text>
    <text x="16" y="345" fill="#F43F5E" font-family="monospace" font-size="9">SPATIAL RESOLUTION: 0.1 mm (fUS)</text>
  </g>

  <!-- Left Scientific Panel: Magneto-Optical Signal Waveform -->
  <g transform="translate(100, 180)">
    <rect width="260" height="240" rx="8" fill="#150B28" fill-opacity="0.9" stroke="#6D28D9" stroke-width="1.5"/>
    <text x="16" y="28" fill="#A855F7" font-family="monospace" font-size="10" letter-spacing="1">CORTICAL VOLTAGE (μV)</text>
    <polyline points="20,100 50,70 80,120 110,60 140,110 170,80 200,100 230,65" fill="none" stroke="#FDE047" stroke-width="2" filter="url(#bciBloom)"/>
    <text x="16" y="160" fill="#94A3B8" font-family="monospace" font-size="9">GAMMA SYNCHRONY: 42 Hz</text>
    <text x="16" y="185" fill="#38BDF8" font-family="monospace" font-size="9">SIGNAL-TO-NOISE: 34 dB</text>
    <text x="16" y="210" fill="#10B981" font-family="monospace" font-size="9">OPTODE POWER: 2.4 mW (EYE-SAFE)</text>
  </g>

  <!-- Frame & Metadata -->
  <text x="60" y="80" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="2">MONOGRAPH 10 · FUTURE OF AI IN BRAIN-COMPUTER INTERFACES</text>
  <text x="60" y="105" fill="#C084FC" font-family="monospace" font-size="10">FIG. 10 — HIGH-DENSITY MAGNETO-OPTICAL AND FUNCTIONAL ULTRASOUND SPEECH DECODING</text>
  <rect x="20" y="20" width="1160" height="860" fill="none" stroke="#2E1065" stroke-width="1"/>
</svg>
