<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bciGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1E1035" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#080314" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="neuralFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="bciBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="800" height="600" fill="#080314"/>
  <rect width="800" height="600" fill="url(#bciGlow)"/>

  <!-- Cranial & Cortex Profile Contour (Minimalist Cyber Aesthetic) -->
  <path d="M 280 480 C 260 420, 220 380, 220 300 C 220 180, 310 100, 440 100 C 560 100, 640 190, 640 310 C 640 400, 580 470, 560 500" 
        fill="none" stroke="#6D28D9" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- High-Bandwidth Neural Mesh Lace (Over Cerebral Cortex) -->
  <g stroke="url(#neuralFlow)" stroke-width="1.5" fill="none">
    <!-- Synaptic Lattice Interconnects -->
    <path d="M 320 200 Q 380 150, 460 180 T 580 230"/>
    <path d="M 280 260 Q 360 210, 450 250 T 590 300"/>
    <path d="M 260 320 Q 350 280, 440 320 T 570 380"/>
    <path d="M 300 390 Q 390 350, 480 390 T 540 440"/>
    
    <!-- Vertical Dendritic Axons -->
    <path d="M 340 170 Q 350 270, 330 380"/>
    <path d="M 400 155 Q 410 280, 420 400"/>
    <path d="M 460 170 Q 480 290, 470 410"/>
    <path d="M 520 200 Q 530 300, 530 420"/>
  </g>

  <!-- Synaptic Nodes with Glowing Action Potentials -->
  <g filter="url(#bciBloom)">
    <circle cx="380" cy="190" r="7" fill="#06B6D4"/>
    <circle cx="460" cy="180" r="8" fill="#A855F7"/>
    <circle cx="360" cy="270" r="6" fill="#F43F5E"/>
    <circle cx="440" cy="260" r="9" fill="#06B6D4"/>
    <circle cx="520" cy="280" r="7" fill="#A855F7"/>
    <circle cx="350" cy="350" r="7" fill="#A855F7"/>
    <circle cx="430" cy="340" r="8" fill="#F43F5E"/>
    <circle cx="500" cy="360" r="6" fill="#06B6D4"/>
  </g>

  <!-- External Non-Invasive Transducer Crown Band -->
  <path d="M 230 240 C 340 180, 480 180, 610 240" fill="none" stroke="#F59E0B" stroke-width="3" filter="url(#bciBloom)"/>
  <circle cx="230" cy="240" r="6" fill="#F59E0B"/>
  <circle cx="330" cy="205" r="5" fill="#F59E0B"/>
  <circle cx="430" cy="195" r="5" fill="#F59E0B"/>
  <circle cx="530" cy="205" r="5" fill="#F59E0B"/>
  <circle cx="610" cy="240" r="6" fill="#F59E0B"/>

  <!-- High-Bandwidth Data Burst Stream (Ascending to Cloud Atlas) -->
  <g stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.8">
    <line x1="440" y1="180" x2="440" y2="40"/>
    <line x1="460" y1="170" x2="520" y2="40"/>
    <line x1="400" y1="180" x2="360" y2="40"/>
  </g>

  <!-- Real-Time Neural Signal Callout -->
  <rect x="80" y="420" width="180" height="60" rx="6" fill="#140A26" stroke="#A855F7" stroke-width="1"/>
  <text x="92" y="442" font-family="monospace" font-size="10" fill="#E9D5FF">SYNAPTIC BANDWIDTH</text>
  <text x="92" y="462" font-family="monospace" font-size="9" fill="#06B6D4">12.8 Gbps // LATENCY 1.8ms</text>
  <line x1="260" y1="445" x2="330" y2="380" stroke="#A855F7" stroke-width="1"/>

  <rect x="540" y="420" width="180" height="60" rx="6" fill="#140A26" stroke="#06B6D4" stroke-width="1"/>
  <text x="552" y="442" font-family="monospace" font-size="10" fill="#67E8F9">MOTOR CORTEX INTENT</text>
  <text x="552" y="462" font-family="monospace" font-size="9" fill="#F43F5E">99.7% ACCURACY DECODE</text>
  <line x1="540" y1="445" x2="480" y2="390" stroke="#06B6D4" stroke-width="1"/>

  <!-- Technical Headings -->
  <text x="50" y="60" font-family="monospace" font-size="12" fill="#A855F7" letter-spacing="2">NEURAL INTERFACE &amp; COGNITIVE AUGMENTATION // 2035</text>
  <text x="50" y="80" font-family="monospace" font-size="10" fill="#94A3B8">BIO-COMPATIBLE SYNAPTIC LACE &amp; REAL-TIME SUB-VOCAL MOTOR DECODING</text>
  <text x="750" y="570" font-family="monospace" font-size="11" fill="#06B6D4" text-anchor="end">NEUROPLASTIC INTEGRATION: HOMOGENEOUS // ZERO REJECTION</text>
</svg>
