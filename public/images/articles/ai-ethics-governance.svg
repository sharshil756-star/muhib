<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="ethicsAtmosphere" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#7C2D12" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#1C1917" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0A0807" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="terracottaProofShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <filter id="ethicsBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Governance Obsidian Canvas -->
  <rect width="1200" height="900" fill="#0A0807"/>
  <rect width="1200" height="900" fill="url(#ethicsAtmosphere)"/>

  <!-- Concentric Consensus Rings (Global Oversight Amphitheater) -->
  <g transform="translate(600, 460)">
    <ellipse cx="0" cy="0" rx="460" ry="180" fill="none" stroke="#292524" stroke-width="1.5" stroke-dasharray="10 8"/>
    <ellipse cx="0" cy="0" rx="380" ry="150" fill="none" stroke="#44403C" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="300" ry="118" fill="none" stroke="#78716C" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>

  <!-- Geometric Cryptographic Shield Matrix (Center Focal Anchor) -->
  <g transform="translate(600, 420)">
    <!-- Outer Shield Crest -->
    <path d="M 0 -220 L 220 -140 L 220 70 C 220 200, 0 280, 0 280 C 0 280, -220 200, -220 70 L -220 -140 Z" 
          fill="#1C1917" stroke="url(#terracottaProofShield)" stroke-width="3" opacity="0.95"/>

    <!-- Inner Faceted Verification Boundary -->
    <path d="M 0 -170 L 170 -110 L 170 60 C 170 160, 0 220, 0 220 C 0 220, -170 160, -170 60 L -170 -110 Z" 
          fill="#292524" stroke="#F97316" stroke-width="2" opacity="0.7"/>

    <!-- Central Mechanistic Interpretability Core (Zero-Knowledge Verifier) -->
    <circle cx="0" cy="20" r="80" fill="#0C0A09" stroke="#FB923C" stroke-width="2.5" filter="url(#ethicsBloom)"/>
    <circle cx="0" cy="20" r="32" fill="#7C2D12" stroke="#FDE047" stroke-width="2"/>
    <circle cx="0" cy="20" r="10" fill="#FFFFFF"/>

    <!-- Merkle Cryptographic Audit Tree inside Shield -->
    <g stroke="#FDBA74" stroke-width="2" fill="none">
      <!-- Root Line -->
      <line x1="0" y1="-50" x2="-60" y2="10"/>
      <line x1="0" y1="-50" x2="60" y2="10"/>
      <!-- Sub-Trees -->
      <line x1="-60" y1="10" x2="-90" y2="70"/>
      <line x1="-60" y1="10" x2="-30" y2="70"/>
      <line x1="60" y1="10" x2="30" y2="70"/>
      <line x1="60" y1="10" x2="90" y2="70"/>
    </g>

    <!-- Cryptographic Proof Leaf Nodes -->
    <g filter="url(#ethicsBloom)">
      <circle cx="0" cy="-50" r="9" fill="#EA580C"/>
      <circle cx="-60" cy="10" r="7" fill="#C2410C"/>
      <circle cx="60" cy="10" r="7" fill="#C2410C"/>
      <circle cx="-90" cy="70" r="6" fill="#FDE047"/>
      <circle cx="-30" cy="70" r="6" fill="#FDE047"/>
      <circle cx="30" cy="70" r="6" fill="#FDE047"/>
      <circle cx="90" cy="70" r="6" fill="#FDE047"/>
    </g>
  </g>

  <!-- Left Scientific Panel: Causal DAG Graph -->
  <g transform="translate(100, 200)">
    <rect width="260" height="340" rx="8" fill="#141110" fill-opacity="0.9" stroke="#292524" stroke-width="1.5"/>
    <text x="16" y="24" fill="#FB923C" font-family="monospace" font-size="10" letter-spacing="1">CAUSAL ATTRIBUTION DAG</text>
    <!-- Causal Graph Lines -->
    <g stroke="#F59E0B" stroke-width="1.5" fill="none">
      <line x1="40" y1="80" x2="130" y2="120"/>
      <line x1="40" y1="160" x2="130" y2="120"/>
      <line x1="130" y1="120" x2="210" y2="120"/>
      <line x1="130" y1="120" x2="210" y2="200"/>
    </g>
    <circle cx="40" cy="80" r="10" fill="#292524" stroke="#FB923C" stroke-width="2"/>
    <circle cx="40" cy="160" r="10" fill="#292524" stroke="#FB923C" stroke-width="2"/>
    <circle cx="130" cy="120" r="14" fill="#7C2D12" stroke="#FDE047" stroke-width="2"/>
    <circle cx="210" cy="120" r="10" fill="#292524" stroke="#10B981" stroke-width="2"/>
    <circle cx="210" cy="200" r="10" fill="#292524" stroke="#10B981" stroke-width="2"/>
    <text x="16" y="270" fill="#94A3B8" font-family="monospace" font-size="9">FAIRNESS INVARIANT: PROVEN</text>
    <text x="16" y="295" fill="#10B981" font-family="monospace" font-size="9">COUNTERFACTUAL DRIFT: 0.00%</text>
  </g>

  <!-- Right Scientific Panel: Cryptographic Proof Log -->
  <g transform="translate(840, 200)">
    <rect width="260" height="340" rx="8" fill="#141110" fill-opacity="0.9" stroke="#292524" stroke-width="1.5"/>
    <text x="16" y="24" fill="#FB923C" font-family="monospace" font-size="10" letter-spacing="1">ZERO-KNOWLEDGE LEDGER</text>
    <text x="16" y="60" fill="#FDE047" font-family="monospace" font-size="11">PROOF #9481-VERIFIED</text>
    <text x="16" y="90" fill="#94A3B8" font-family="monospace" font-size="8">HASH: 0x7F4B...99A1C3</text>
    <text x="16" y="115" fill="#94A3B8" font-family="monospace" font-size="8">CURVE: BLS12-381 SNARK</text>
    <text x="16" y="150" fill="#38BDF8" font-family="monospace" font-size="9">ALIGNMENT GUARANTEE: 100%</text>
    <text x="16" y="180" fill="#94A3B8" font-family="monospace" font-size="8">MUNICIPAL TRIAGE AUDIT</text>
    <rect x="16" y="200" width="220" height="8" rx="2" fill="#292524"/>
    <rect x="16" y="200" width="220" height="8" rx="2" fill="#10B981"/>
    <text x="16" y="235" fill="#10B981" font-family="monospace" font-size="9">CONSTITUTIONAL BOUND: STRICT</text>
  </g>

  <!-- Frame & Metadata -->
  <text x="60" y="80" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="2">MONOGRAPH 08 · FUTURE OF AI ETHICS &amp; ALGORITHMIC GOVERNANCE</text>
  <text x="60" y="105" fill="#FB923C" font-family="monospace" font-size="10">FIG. 08 — ZERO-KNOWLEDGE PROOF LEDGER AND MECHANISTIC INTERPRETABILITY</text>
  <rect x="20" y="20" width="1160" height="860" fill="none" stroke="#292524" stroke-width="1"/>
</svg>
