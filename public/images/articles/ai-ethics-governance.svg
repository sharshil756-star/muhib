<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="ethicsGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#7C2D12" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#1C1917" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="terracottaShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <filter id="ethicsBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="800" height="600" fill="#0C0A09"/>
  <rect width="800" height="600" fill="url(#ethicsGlow)"/>

  <!-- Geometric Cryptographic Shield Matrix -->
  <!-- Outer Shield Outline -->
  <path d="M 400 90 L 590 160 L 590 340 C 590 460, 400 520, 400 520 C 400 520, 210 460, 210 340 L 210 160 Z" 
        fill="#1C1917" stroke="url(#terracottaShield)" stroke-width="2.5" opacity="0.95"/>

  <!-- Inner Transparent Verification Facets -->
  <path d="M 400 130 L 550 185 L 550 330 C 550 425, 400 480, 400 480 C 400 480, 250 425, 250 330 L 250 185 Z" 
        fill="#292524" stroke="#F97316" stroke-width="1.5" opacity="0.7"/>

  <!-- Central Neuro-Symbolic Proof Core -->
  <circle cx="400" cy="300" r="75" fill="#0C0A09" stroke="#FB923C" stroke-width="2" filter="url(#ethicsBloom)"/>
  
  <!-- Cryptographic Hash Tree / Merkle Proof Tree inside Shield -->
  <g stroke="#FDBA74" stroke-width="1.5" fill="none">
    <!-- Level 1 Root -->
    <line x1="400" y1="260" x2="350" y2="310"/>
    <line x1="400" y1="260" x2="450" y2="310"/>
    <!-- Level 2 Leaves -->
    <line x1="350" y1="310" x2="320" y2="360"/>
    <line x1="350" y1="310" x2="370" y2="360"/>
    <line x1="450" y1="310" x2="430" y2="360"/>
    <line x1="450" y1="310" x2="480" y2="360"/>
  </g>

  <!-- Nodes with Glowing Proof Symbols -->
  <circle cx="400" cy="260" r="8" fill="#EA580C"/>
  <circle cx="350" cy="310" r="7" fill="#C2410C"/>
  <circle cx="450" cy="310" r="7" fill="#C2410C"/>
  <circle cx="320" cy="360" r="5" fill="#FB923C"/>
  <circle cx="370" cy="360" r="5" fill="#FB923C"/>
  <circle cx="430" cy="360" r="5" fill="#FB923C"/>
  <circle cx="480" cy="360" r="5" fill="#FB923C"/>

  <!-- Concentric Consensus Rings -->
  <ellipse cx="400" cy="300" rx="280" ry="110" fill="none" stroke="#78716C" stroke-width="1" stroke-dasharray="8 6" opacity="0.4"/>
  <ellipse cx="400" cy="300" rx="330" ry="130" fill="none" stroke="#EA580C" stroke-width="1" stroke-dasharray="4 8" opacity="0.5"/>

  <!-- Verifiable AI Auditing Callout Badges -->
  <!-- Left Badge -->
  <rect x="70" y="240" width="160" height="55" rx="6" fill="#1C1917" stroke="#EA580C" stroke-width="1"/>
  <text x="82" y="262" font-family="monospace" font-size="10" fill="#FB923C">PROVENANCE LOG // V7</text>
  <text x="82" y="280" font-family="monospace" font-size="9" fill="#A8A29E">SHA-256: e8f9...31c2</text>
  <line x1="230" y1="267" x2="250" y2="280" stroke="#EA580C" stroke-width="1"/>

  <!-- Right Badge -->
  <rect x="570" y="240" width="160" height="55" rx="6" fill="#1C1917" stroke="#10B981" stroke-width="1"/>
  <text x="582" y="262" font-family="monospace" font-size="10" fill="#34D399">ZERO-KNOWLEDGE AUDIT</text>
  <text x="582" y="280" font-family="monospace" font-size="9" fill="#A8A29E">BIAS BIOMARKER: ZERO</text>
  <line x1="570" y1="267" x2="550" y2="280" stroke="#10B981" stroke-width="1"/>

  <!-- Technical Overlay Typography -->
  <text x="50" y="60" font-family="monospace" font-size="12" fill="#FB923C" letter-spacing="2">NEURO-SYMBOLIC ALGORITHMIC GOVERNANCE MATRIX</text>
  <text x="50" y="80" font-family="monospace" font-size="10" fill="#78716C">MATHEMATICAL FORMAL VERIFICATION &amp; EXPLAINABLE WEIGHT GEOMETRY</text>
  <text x="750" y="570" font-family="monospace" font-size="11" fill="#EA580C" text-anchor="end">GOVERNANCE PROTOCOL: 100% AUDITABLE AT INFERENCE RUNTIME</text>
</svg>
