<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="climateAtmosphere" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#042F2E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#041214" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="fusionPlasma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="1"/>
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="solarGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="climateBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Ecology Canvas -->
  <rect width="1200" height="900" fill="#041214"/>
  <rect width="1200" height="900" fill="url(#climateAtmosphere)"/>

  <!-- Atmospheric Dynamic Streamlines (Predictive Wind Modeling) -->
  <g stroke="#10B981" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M 0 220 C 300 160, 600 260, 1200 180"/>
    <path d="M 0 260 C 350 200, 700 300, 1200 220"/>
    <path d="M 0 300 C 250 250, 650 340, 1200 270"/>
  </g>

  <!-- Continental Landscape Silhouette (Nordic Fjord & Offshore Shallows) -->
  <polygon points="0,680 240,520 480,600 750,480 1020,570 1200,500 1200,900 0,900" fill="#061F21"/>

  <!-- Reflective Smart Water Grid & Underwater Tidal Turbines -->
  <rect x="0" y="660" width="1200" height="240" fill="#051719"/>
  <g stroke="#34D399" stroke-width="1.2" opacity="0.35">
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
    <line x1="0" y1="810" x2="1200" y2="810"/>
    <line x1="0" y1="870" x2="1200" y2="870"/>
  </g>

  <!-- Autonomous Wind Turbine Arrays with Real-Time Pitch Telemetry -->
  <!-- Turbine 1 (Foreground Left) -->
  <g transform="translate(320, 360)">
    <line x1="0" y1="300" x2="0" y2="0" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#F8FAFC" stroke="#0284C7" stroke-width="2"/>
    <!-- Kinetic Blades -->
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#34D399" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="104" y2="60" stroke="#34D399" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-104" y2="60" stroke="#34D399" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Blade Tip Sensor Nodes -->
    <circle cx="0" cy="-120" r="4" fill="#FDE047" filter="url(#climateBloom)"/>
    <circle cx="104" cy="60" r="4" fill="#FDE047" filter="url(#climateBloom)"/>
    <circle cx="-104" cy="60" r="4" fill="#FDE047" filter="url(#climateBloom)"/>
  </g>

  <!-- Turbine 2 (Midground Right) -->
  <g transform="translate(860, 320)">
    <line x1="0" y1="280" x2="0" y2="0" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="8" fill="#F8FAFC" stroke="#0284C7" stroke-width="2"/>
    <!-- Kinetic Blades -->
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="86" y2="50" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-86" y2="50" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Central AI Tokamak Fusion Substation (Clean Base-Load Core) -->
  <g transform="translate(600, 520)">
    <!-- Substation Foundation -->
    <rect x="-140" y="60" width="280" height="120" rx="8" fill="#0A2526" stroke="#34D399" stroke-width="2"/>
    
    <!-- Toroidal Magnetic Confinement Chamber -->
    <ellipse cx="0" cy="40" rx="110" ry="45" fill="#021B1C" stroke="#38BDF8" stroke-width="2.5"/>
    <!-- Glowing Fusion Plasma Core -->
    <circle cx="0" cy="40" r="34" fill="url(#fusionPlasma)" filter="url(#climateBloom)"/>
    <ellipse cx="0" cy="40" rx="70" ry="24" fill="none" stroke="#FDE047" stroke-width="2" stroke-dasharray="6 4" filter="url(#climateBloom)"/>
    
    <!-- High-Voltage Autonomous Transmission Lines -->
    <path d="M -140 80 L -380 180" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M 140 80 L 380 180" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8 6"/>
  </g>

  <!-- Biophilic Solar Collector Terraces (Isometric Cascades on Left Ridge) -->
  <g transform="translate(140, 550)">
    <polygon points="0,0 60,-20 120,0 60,20" fill="url(#solarGlint)" stroke="#34D399" stroke-width="1.2"/>
    <polygon points="40,25 100,5 160,25 100,45" fill="url(#solarGlint)" stroke="#34D399" stroke-width="1.2"/>
    <polygon points="80,50 140,30 200,50 140,70" fill="url(#solarGlint)" stroke="#34D399" stroke-width="1.2"/>
  </g>

  <!-- Live Grid Telemetry HUD -->
  <g transform="translate(850, 160)">
    <rect width="260" height="150" rx="6" fill="#061B1D" fill-opacity="0.85" stroke="#10B981" stroke-width="1.5"/>
    <text x="16" y="24" fill="#34D399" font-family="monospace" font-size="10" letter-spacing="1">GRID FREQUENCY: 50.002 Hz</text>
    <path d="M 16 85 Q 50 40, 80 85 T 140 85 T 200 85 T 240 85" fill="none" stroke="#F59E0B" stroke-width="2" filter="url(#climateBloom)"/>
    <text x="16" y="115" fill="#94A3B8" font-family="monospace" font-size="9">RENEWABLE PENETRATION: 94.8%</text>
    <text x="16" y="132" fill="#38BDF8" font-family="monospace" font-size="9">AUTONOMOUS CURTAILMENT: 0.0%</text>
  </g>

  <!-- Frame & Scientific Metadata -->
  <text x="60" y="80" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="2">MONOGRAPH 02 · FUTURE OF AI IN CLIMATE &amp; CLEAN ENERGY GRIDS</text>
  <text x="60" y="105" fill="#34D399" font-family="monospace" font-size="10">FIG. 02 — CONTINENTAL MICRO-GRID LOAD BALANCING AND TOKAMAK EQUILIBRIUM</text>
  <rect x="20" y="20" width="1160" height="860" fill="none" stroke="#1E293B" stroke-width="1"/>
</svg>
