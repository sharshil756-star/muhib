<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="spaceGlow" cx="65%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="europaGlow" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="90%" stop-color="#082F49"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="ionExhaust" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="1"/>
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0"/>
    </linearGradient>
    <filter id="spaceBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Void -->
  <rect width="800" height="600" fill="#02040A"/>
  <rect width="800" height="600" fill="url(#spaceGlow)"/>

  <!-- Star Field -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="80" cy="120" r="1"/>
    <circle cx="150" cy="80" r="1.5"/>
    <circle cx="240" cy="180" r="1"/>
    <circle cx="320" cy="90" r="1"/>
    <circle cx="480" cy="60" r="1.2"/>
    <circle cx="700" cy="140" r="1"/>
    <circle cx="750" cy="80" r="1.8"/>
    <circle cx="100" cy="380" r="1.2"/>
    <circle cx="210" cy="460" r="1"/>
    <circle cx="680" cy="480" r="1.5"/>
    <circle cx="590" cy="530" r="1"/>
  </g>

  <!-- Distant Celestial Body (Icy Moon Europa / Gas Giant Rings) -->
  <circle cx="620" cy="220" r="140" fill="url(#europaGlow)"/>
  <!-- Planet Rings with Shadows -->
  <ellipse cx="620" cy="220" rx="280" ry="45" fill="none" stroke="#E2E8F0" stroke-width="6" opacity="0.45" transform="rotate(-20 620 220)"/>
  <ellipse cx="620" cy="220" rx="260" ry="40" fill="none" stroke="#93C5FD" stroke-width="2" opacity="0.6" transform="rotate(-20 620 220)"/>
  <ellipse cx="620" cy="220" rx="230" ry="35" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.3" transform="rotate(-20 620 220)"/>

  <!-- Autonomous Deep Space AI Exploration Probe (Center-Left) -->
  <g transform="translate(280, 310) rotate(15)">
    <!-- Ion Propulsion Plume -->
    <polygon points="-120,-8 -120,8 -20,12 -20,-12" fill="url(#ionExhaust)" filter="url(#spaceBloom)"/>
    <line x1="-120" y1="0" x2="-20" y2="0" stroke="#E0F2FE" stroke-width="2" filter="url(#spaceBloom)"/>

    <!-- Main Bus Chassis (Titanium Carbon Composite) -->
    <rect x="-20" y="-30" width="80" height="60" rx="6" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
    <rect x="0" y="-22" width="45" height="44" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>

    <!-- High-Gain Parabolic Telemetry Dish -->
    <path d="M 60 -50 A 60 60 0 0 1 60 50 Z" fill="#334155" stroke="#F1F5F9" stroke-width="2"/>
    <line x1="60" y1="0" x2="85" y2="0" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="85" cy="0" r="3" fill="#F59E0B" filter="url(#spaceBloom)"/>

    <!-- Solar / RTG Array Wings -->
    <rect x="10" y="-120" width="22" height="90" rx="2" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="10" y="30" width="22" height="90" rx="2" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Solar Cell Grid lines -->
    <line x1="10" y1="-90" x2="32" y2="-90" stroke="#7DD3FC" stroke-width="1"/>
    <line x1="10" y1="-60" x2="32" y2="-60" stroke="#7DD3FC" stroke-width="1"/>
    <line x1="10" y1="60" x2="32" y2="60" stroke="#7DD3FC" stroke-width="1"/>
    <line x1="10" y1="90" x2="32" y2="90" stroke="#7DD3FC" stroke-width="1"/>

    <!-- Autonomous Optical Navigation Cameras & Lidar -->
    <circle cx="45" cy="-18" r="6" fill="#0369A1" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="45" cy="18" r="6" fill="#0369A1" stroke="#38BDF8" stroke-width="1.5"/>
  </g>

  <!-- Autonomous Navigation Vectors & Real-Time Trajectory AI -->
  <path d="M 120 480 Q 280 320, 520 220" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="520" cy="220" r="5" fill="none" stroke="#F59E0B" stroke-width="2"/>
  
  <!-- Optical Target Reticle -->
  <g transform="translate(620, 220)" stroke="#38BDF8" stroke-width="1" opacity="0.8">
    <circle cx="0" cy="0" r="28" fill="none" stroke-dasharray="4 4"/>
    <line x1="-35" y1="0" x2="-20" y2="0"/>
    <line x1="20" y1="0" x2="35" y2="0"/>
    <line x1="0" y1="-35" x2="0" y2="-20"/>
    <line x1="0" y1="20" x2="0" y2="35"/>
  </g>

  <!-- Technical Telemetry Typography -->
  <text x="50" y="60" font-family="monospace" font-size="12" fill="#38BDF8" letter-spacing="2">AUTONOMOUS INTERPLANETARY EXPLORER // ODYSSEY-9</text>
  <text x="50" y="80" font-family="monospace" font-size="10" fill="#94A3B8">LIGHT-LAG DELAY: 48.6 MIN // ONBOARD EDGE-AI PATHFINDING (ZERO EARTH TELEOP)</text>
  <text x="750" y="570" font-family="monospace" font-size="11" fill="#F59E0B" text-anchor="end">AUTONOMOUS ORBIT INSERTION: 99.999% TRAJECTORY CONFIDENCE</text>
</svg>
