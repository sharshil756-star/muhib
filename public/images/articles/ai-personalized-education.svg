<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="eduAtmosphere" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#312E81" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#1E1B4B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#08071A" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="socraticMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="eduBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Scholarly Violet Canvas -->
  <rect width="1200" height="900" fill="#08071A"/>
  <rect width="1200" height="900" fill="url(#eduAtmosphere)"/>

  <!-- Library Architecture Perspective Lines & Reading Table -->
  <g stroke="#1E1B4B" stroke-width="1.2" opacity="0.6">
    <line x1="120" y1="0" x2="120" y2="900"/>
    <line x1="1080" y1="0" x2="1080" y2="900"/>
    <line x1="0" y1="680" x2="1200" y2="680"/>
    <line x1="0" y1="780" x2="1200" y2="780"/>
    <!-- Timber Table Perspective -->
    <polygon points="120,680 1080,680 1200,900 0,900" fill="#0D0C22"/>
  </g>

  <!-- Student Scholar Profile (Left-Center Foreground) -->
  <g transform="translate(280, 520)">
    <!-- Scholar Silhouette -->
    <path d="M 0 160 C 0 80, 20 40, 50 30 C 35 15, 40 -15, 60 -30 C 85 -45, 115 -45, 135 -30 C 150 -15, 150 15, 140 30 C 170 40, 190 80, 190 160 Z" fill="#131138"/>
    <!-- Minimalist Titanium Neural Frame Glasses -->
    <rect x="85" y="-15" width="40" height="18" rx="4" fill="none" stroke="#38BDF8" stroke-width="2" filter="url(#eduBloom)"/>
    <line x1="125" y1="-6" x2="150" y2="-2" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="95" cy="-6" r="3" fill="#FDE047"/>
  </g>

  <!-- Floating Holographic 3D Socratic Knowledge Graph (Center of Canvas) -->
  <g transform="translate(680, 420)">
    <!-- Central Epistemological Master Concept -->
    <circle cx="0" cy="0" r="38" fill="#1E1B4B" stroke="#818CF8" stroke-width="2.5" filter="url(#eduBloom)"/>
    <circle cx="0" cy="0" r="16" fill="#38BDF8" filter="url(#eduBloom)"/>
    <text x="0" y="5" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">SYNTHESIS</text>

    <!-- Branching Epistemic Nodes -->
    <!-- Node A: Quantum Electrodynamics -->
    <line x1="0" y1="0" x2="-140" y2="-120" stroke="url(#socraticMesh)" stroke-width="2"/>
    <circle cx="-140" cy="-120" r="24" fill="#0C132B" stroke="#38BDF8" stroke-width="2"/>
    <text x="-140" y="-116" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">PHYSICS</text>

    <!-- Node B: Computational Linguistics -->
    <line x1="0" y1="0" x2="160" y2="-100" stroke="url(#socraticMesh)" stroke-width="2"/>
    <circle cx="160" cy="-100" r="26" fill="#0C132B" stroke="#F59E0B" stroke-width="2"/>
    <text x="160" y="-96" fill="#F59E0B" font-family="monospace" font-size="9" text-anchor="middle">SEMANTICS</text>

    <!-- Node C: Bio-Molecular Systems -->
    <line x1="0" y1="0" x2="-180" y2="40" stroke="url(#socraticMesh)" stroke-width="2"/>
    <circle cx="-180" cy="40" r="22" fill="#0C132B" stroke="#34D399" stroke-width="2"/>
    <text x="-180" y="44" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">BIOLOGY</text>

    <!-- Node D: Causal Philosophy -->
    <line x1="0" y1="0" x2="180" y2="70" stroke="url(#socraticMesh)" stroke-width="2"/>
    <circle cx="180" cy="70" r="22" fill="#0C132B" stroke="#C084FC" stroke-width="2"/>
    <text x="180" y="74" fill="#C084FC" font-family="monospace" font-size="9" text-anchor="middle">ETHICS</text>

    <!-- Sub-Nodes and Interconnecting Synapses -->
    <line x1="-140" y1="-120" x2="-220" y2="-160" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="-220" cy="-160" r="8" fill="#38BDF8"/>
    <line x1="160" y1="-100" x2="240" y2="-150" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="240" cy="-150" r="8" fill="#F59E0B"/>
    <line x1="-180" y1="40" x2="180" y2="70" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

    <!-- Orbital Comprehension Halo -->
    <ellipse cx="0" cy="0" rx="260" ry="180" fill="none" stroke="#6366F1" stroke-width="1" stroke-dasharray="8 6" opacity="0.4"/>
  </g>

  <!-- Real-Time Cognitive Load & Adaptive Pacing Telemetry HUD -->
  <g transform="translate(830, 160)">
    <rect width="280" height="160" rx="6" fill="#131138" fill-opacity="0.85" stroke="#818CF8" stroke-width="1.5"/>
    <text x="16" y="24" fill="#818CF8" font-family="monospace" font-size="10" letter-spacing="1">COGNITIVE LOAD MODELING</text>
    <!-- Live Waveform -->
    <path d="M 16 80 Q 40 40, 70 80 T 130 80 T 190 80 T 260 80" fill="none" stroke="#38BDF8" stroke-width="2" filter="url(#eduBloom)"/>
    <text x="16" y="112" fill="#94A3B8" font-family="monospace" font-size="9">SOCRATIC DIALOGUE: CONVERGENT</text>
    <text x="16" y="130" fill="#34D399" font-family="monospace" font-size="9">CONCEPT RETENTION HORIZON: 94%</text>
    <text x="16" y="148" fill="#F59E0B" font-family="monospace" font-size="9">ADAPTIVE PACING: OPTIMAL FLOW</text>
  </g>

  <!-- Frame & Metadata -->
  <text x="60" y="80" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="2">MONOGRAPH 04 · FUTURE OF AI IN PERSONALIZED EDUCATION</text>
  <text x="60" y="105" fill="#818CF8" font-family="monospace" font-size="10">FIG. 04 — REAL-TIME NEURAL COGNITIVE LOAD AND SOCRATIC KNOWLEDGE GRAPH</text>
  <rect x="20" y="20" width="1160" height="860" fill="none" stroke="#1E1B4B" stroke-width="1"/>
</svg>
