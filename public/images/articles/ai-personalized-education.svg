<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="eduGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090D18" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#090D18"/>
  <rect width="800" height="600" fill="url(#eduGlow)"/>

  <!-- Amphitheater Perspective Seminar Lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.65">
    <ellipse cx="400" cy="520" rx="340" ry="110" fill="none"/>
    <ellipse cx="400" cy="480" rx="280" ry="85" fill="none"/>
    <ellipse cx="400" cy="440" rx="220" ry="60" fill="none"/>
  </g>

  <!-- Central Floating Socratic AI Knowledge Orb -->
  <circle cx="400" cy="250" r="85" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2" opacity="0.6"/>
  <circle cx="400" cy="250" r="55" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#glow)"/>
  <circle cx="400" cy="250" r="16" fill="#F8FAFC" filter="url(#glow)"/>

  <!-- Orbital Knowledge Rings (Quantum Physics & Astrophysics Hologram) -->
  <ellipse cx="400" cy="250" rx="190" ry="65" fill="none" stroke="#38BDF8" stroke-width="1.5" transform="rotate(-20 400 250)" filter="url(#glow)"/>
  <ellipse cx="400" cy="250" rx="190" ry="65" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="8 6" transform="rotate(35 400 250)"/>
  <ellipse cx="400" cy="250" rx="210" ry="70" fill="none" stroke="#F59E0B" stroke-width="1.2" transform="rotate(80 400 250)"/>

  <!-- Floating Holographic Quantum Nodes -->
  <circle cx="240" cy="200" r="8" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="560" cy="300" r="8" fill="#8B5CF6" filter="url(#glow)"/>
  <circle cx="490" cy="160" r="7" fill="#F59E0B"/>
  <circle cx="310" cy="340" r="7" fill="#38BDF8"/>

  <!-- Projected Socratic Dialogue Rays to Student Desks -->
  <g stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 5" opacity="0.6">
    <line x1="400" y1="250" x2="220" y2="460"/>
    <line x1="400" y1="250" x2="400" y2="480"/>
    <line x1="400" y1="250" x2="580" y2="460"/>
  </g>

  <!-- Student Silhouettes Around Desks (Active Engagement) -->
  <g fill="#1E293B">
    <!-- Student 1 -->
    <circle cx="220" cy="430" r="14"/>
    <path d="M 200 470 C 200 450, 240 450, 240 470 Z"/>
    <!-- Student 2 -->
    <circle cx="400" cy="450" r="14"/>
    <path d="M 380 490 C 380 470, 420 470, 420 490 Z"/>
    <!-- Student 3 -->
    <circle cx="580" cy="430" r="14"/>
    <path d="M 560 470 C 560 450, 600 450, 600 470 Z"/>
  </g>

  <!-- Interactive Transparent Holographic Tablets at Desks -->
  <rect x="185" y="470" width="70" height="35" rx="3" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1"/>
  <rect x="365" y="490" width="70" height="35" rx="3" fill="#8B5CF6" fill-opacity="0.3" stroke="#A78BFA" stroke-width="1"/>
  <rect x="545" y="470" width="70" height="35" rx="3" fill="#F59E0B" fill-opacity="0.3" stroke="#F59E0B" stroke-width="1"/>

  <!-- Pedagogy Telemetry HUD Display -->
  <g fill="#0B1120" fill-opacity="0.85" stroke="#1E293B" stroke-width="1">
    <rect x="80" y="40" width="250" height="75" rx="5"/>
    <text x="95" y="65" fill="#A78BFA" font-family="monospace" font-size="11" letter-spacing="1">SOCRATIC AI TUTORING</text>
    <text x="95" y="85" fill="#F8FAFC" font-family="monospace" font-size="12">MASTERY RETENTION: 2.4x</text>
    <text x="95" y="103" fill="#38BDF8" font-family="monospace" font-size="10">COGNITIVE LOAD: BALANCED</text>
  </g>

  <text x="60" y="565" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="2">FIG 04 · FUTURE OF AI PERSONALIZED EDUCATION &amp; CREATIVITY · 16.8 KB</text>
</svg>
