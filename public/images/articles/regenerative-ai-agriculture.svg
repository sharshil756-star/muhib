<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="agriGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#022C22" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#051410" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleLed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="agriBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Bio Canvas -->
  <rect width="800" height="600" fill="#04120D"/>
  <rect width="800" height="600" fill="url(#agriGlow)"/>

  <!-- Vertical Hydroponic Aeroponic Towers (3 Architectural Towers) -->
  <!-- Tower 1 Left -->
  <rect x="120" y="80" width="100" height="460" rx="6" fill="#06281E" stroke="#10B981" stroke-width="1.5"/>
  <rect x="120" y="80" width="100" height="460" fill="url(#purpleLed)"/>
  <!-- Tower 2 Center -->
  <rect x="350" y="50" width="120" height="490" rx="6" fill="#06281E" stroke="#34D399" stroke-width="2"/>
  <rect x="350" y="50" width="120" height="490" fill="url(#purpleLed)"/>
  <!-- Tower 3 Right -->
  <rect x="600" y="90" width="100" height="450" rx="6" fill="#06281E" stroke="#10B981" stroke-width="1.5"/>
  <rect x="600" y="90" width="100" height="450" fill="url(#purpleLed)"/>

  <!-- Hydroponic Plant Shelves & Crop Trays -->
  <g fill="url(#leafGrad)">
    <!-- Left Tower Trays -->
    <ellipse cx="170" cy="150" rx="40" ry="12"/>
    <ellipse cx="170" cy="220" rx="42" ry="13"/>
    <ellipse cx="170" cy="290" rx="40" ry="12"/>
    <ellipse cx="170" cy="360" rx="44" ry="13"/>
    <ellipse cx="170" cy="430" rx="40" ry="12"/>
    
    <!-- Center Tower Trays -->
    <ellipse cx="410" cy="120" rx="50" ry="14"/>
    <ellipse cx="410" cy="190" rx="52" ry="15"/>
    <ellipse cx="410" cy="260" rx="55" ry="16"/>
    <ellipse cx="410" cy="330" rx="52" ry="15"/>
    <ellipse cx="410" cy="400" rx="54" ry="16"/>
    <ellipse cx="410" cy="470" rx="50" ry="15"/>

    <!-- Right Tower Trays -->
    <ellipse cx="650" cy="160" rx="40" ry="12"/>
    <ellipse cx="650" cy="230" rx="42" ry="13"/>
    <ellipse cx="650" cy="300" rx="40" ry="12"/>
    <ellipse cx="650" cy="370" rx="42" ry="13"/>
    <ellipse cx="650" cy="440" rx="40" ry="12"/>
  </g>

  <!-- Autonomous Agri-AI Micro Drone -->
  <g transform="translate(260, 160)">
    <!-- Drone Body -->
    <rect x="-20" y="-8" width="40" height="16" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Rotors -->
    <ellipse cx="-25" cy="-14" rx="16" ry="4" fill="none" stroke="#67E8F9" stroke-width="1.5"/>
    <ellipse cx="25" cy="-14" rx="16" ry="4" fill="none" stroke="#67E8F9" stroke-width="1.5"/>
    <!-- Optical Sensor Scanner Beam -->
    <polygon points="0,8 -60,180 60,180" fill="#38BDF8" opacity="0.18"/>
    <line x1="0" y1="8" x2="0" y2="180" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="0" cy="6" r="4" fill="#38BDF8" filter="url(#agriBloom)"/>
  </g>

  <!-- Ground Autonomous Robotic Weeder / Soil Sensor Cart -->
  <rect x="330" y="520" width="160" height="30" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <circle cx="360" cy="550" r="14" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
  <circle cx="460" cy="550" r="14" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
  <line x1="410" y1="520" x2="410" y2="495" stroke="#34D399" stroke-width="2"/>
  <circle cx="410" cy="492" r="5" fill="#34D399" filter="url(#agriBloom)"/>

  <!-- Telemetry Overlay Lines & Nutrient Readouts -->
  <g stroke="#34D399" stroke-width="1" opacity="0.7">
    <line x1="170" y1="290" x2="260" y2="340"/>
    <circle cx="260" cy="340" r="3" fill="#34D399"/>
  </g>
  <rect x="240" y="345" width="120" height="35" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="248" y="360" font-family="monospace" font-size="9" fill="#A7F3D0">NPK: 14-8-22 OPTIMAL</text>
  <text x="248" y="372" font-family="monospace" font-size="9" fill="#6EE7B7">H₂O USE: -94% VS SOIL</text>

  <!-- Technical Headings -->
  <text x="50" y="60" font-family="monospace" font-size="12" fill="#34D399" letter-spacing="2">AUTONOMOUS VERTICAL AGRI-FACILITY // 2035</text>
  <text x="50" y="80" font-family="monospace" font-size="10" fill="#9CA3AF">CLOSED-LOOP ROBOTIC NUTRIENT RECIRCULATION &amp; MICRO-CLIMATE AI</text>
  <text x="750" y="570" font-family="monospace" font-size="11" fill="#34D399" text-anchor="end">YIELD: 32x PER HECTARE // ZERO PESTICIDES</text>
</svg>
