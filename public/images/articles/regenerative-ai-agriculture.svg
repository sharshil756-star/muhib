<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="agriAtmosphere" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#065F46" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#022C22" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#03140F" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="soilHorizon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="30%" stop-color="#1C1917"/>
      <stop offset="100%" stop-color="#0C0A09"/>
    </linearGradient>
    <linearGradient id="purpleGlowLED" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="agriBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Agro-Bio Canvas -->
  <rect width="1200" height="900" fill="#03140F"/>
  <rect width="1200" height="900" fill="url(#agriAtmosphere)"/>

  <!-- Subterranean Soil Horizon Cross-Section (Bottom Half) -->
  <rect x="0" y="520" width="1200" height="380" fill="url(#soilHorizon)"/>
  <!-- Soil Horizon Demarcation Line -->
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#34D399" stroke-width="2"/>

  <!-- Subterranean Mycorrhizal Fungal Root Network (Glowing Synaptic Strands) -->
  <g stroke="#34D399" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 280 520 Q 320 600, 260 680 T 340 780 T 300 860"/>
    <path d="M 320 600 Q 380 650, 440 720 T 520 820"/>
    <path d="M 600 520 Q 560 620, 640 700 T 580 820 T 660 880"/>
    <path d="M 640 700 Q 720 740, 800 800"/>
    <path d="M 920 520 Q 880 610, 960 710 T 900 840"/>
  </g>
  <!-- Bio-Nutrient Sensor Transponders in Soil -->
  <g filter="url(#agriBloom)">
    <circle cx="260" cy="680" r="6" fill="#FDE047"/>
    <circle cx="440" cy="720" r="7" fill="#38BDF8"/>
    <circle cx="640" cy="700" r="6" fill="#FDE047"/>
    <circle cx="800" cy="800" r="7" fill="#34D399"/>
    <circle cx="960" cy="710" r="6" fill="#FDE047"/>
  </g>

  <!-- Vertical Aeroponic Growth Towers (Right Background) -->
  <g transform="translate(860, 160)">
    <!-- Tower Chassis -->
    <rect x="0" y="0" width="160" height="360" rx="8" fill="#06281E" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="360" fill="url(#purpleGlowLED)"/>
    <!-- Hydroponic Crop Trays -->
    <g fill="url(#canopyGrad)">
      <ellipse cx="80" cy="60" rx="60" ry="16"/>
      <ellipse cx="80" cy="120" rx="64" ry="18"/>
      <ellipse cx="80" cy="180" rx="68" ry="18"/>
      <ellipse cx="80" cy="240" rx="64" ry="18"/>
      <ellipse cx="80" cy="300" rx="60" ry="16"/>
    </g>
  </g>

  <!-- Surface Heritage Crop Rows (Polyculture Wheat & Agroforestry) -->
  <g fill="url(#canopyGrad)" stroke="#064E3B" stroke-width="1.5">
    <!-- Wheat Stalk Clusters -->
    <path d="M 260 520 Q 250 440, 270 380 Q 290 440, 280 520 Z"/>
    <path d="M 280 520 Q 290 420, 310 360 Q 320 420, 300 520 Z"/>
    <path d="M 580 520 Q 560 430, 590 370 Q 610 430, 600 520 Z"/>
    <path d="M 600 520 Q 620 410, 630 350 Q 640 410, 620 520 Z"/>
  </g>

  <!-- Autonomous Solar-Powered Micro-Drone Scout (Hovering Left Center) -->
  <g transform="translate(420, 280)">
    <!-- Drone Fuselage -->
    <ellipse cx="0" cy="0" rx="45" ry="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <!-- Solar Wing Array -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#34D399" stroke-width="4"/>
    <!-- Quad Rotor Blades (Blurred Rotation) -->
    <ellipse cx="-80" cy="0" rx="25" ry="6" fill="#38BDF8" fill-opacity="0.4" stroke="#38BDF8"/>
    <ellipse cx="80" cy="0" rx="25" ry="6" fill="#38BDF8" fill-opacity="0.4" stroke="#38BDF8"/>
    <!-- Downward Hyperspectral Laser Scanner -->
    <polygon points="-30,12 30,12 90,240 -90,240" fill="#10B981" fill-opacity="0.12"/>
    <line x1="0" y1="18" x2="0" y2="240" stroke="#FDE047" stroke-width="2" stroke-dasharray="6 4" filter="url(#agriBloom)"/>
  </g>

  <!-- Real-Time Carbon Flux & Soil Telemetry HUD -->
  <g transform="translate(100, 160)">
    <rect width="280" height="150" rx="6" fill="#042018" fill-opacity="0.85" stroke="#34D399" stroke-width="1.5"/>
    <text x="16" y="24" fill="#34D399" font-family="monospace" font-size="10" letter-spacing="1">SOIL MYCORRHIZAL FLUX</text>
    <text x="16" y="52" fill="#FDE047" font-family="monospace" font-size="13" font-weight="bold">SOIL CARBON: +4.8 TONS/HA</text>
    <text x="16" y="76" fill="#94A3B8" font-family="monospace" font-size="9">RHIZOSPHERE MICROBIOME: BALANCED</text>
    <text x="16" y="98" fill="#38BDF8" font-family="monospace" font-size="9">PRECISION IRRIGATION: -42% WATER</text>
    <text x="16" y="122" fill="#34D399" font-family="monospace" font-size="9">AUTONOMOUS SWARM: 8 ROVERS ACTIVE</text>
  </g>

  <!-- Frame & Metadata -->
  <text x="60" y="80" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="2">MONOGRAPH 06 · FUTURE OF AI IN REGENERATIVE AGRICULTURE</text>
  <text x="60" y="105" fill="#34D399" font-family="monospace" font-size="10">FIG. 06 — SUBTERRANEAN MYCORRHIZAL TELEMETRY AND AUTONOMOUS SWARM DRONES</text>
  <rect x="20" y="20" width="1160" height="860" fill="none" stroke="#064E3B" stroke-width="1"/>
</svg>
